<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Anos de Copa do Mundo</title>
</head>
<body>
   <h1>Programa Anos de Copa do Mundo.Digite 0 para sair</h1>
   
   <script>
    do{
    const ano=Number(prompt("Informe o ano"));
    if(ano===0){
   break;
    }else if(ano==1942 || ano==1946){
      alert(`Não houve Copa ${ano}(Segunda Guerra Mundial)`);  
    }else if(ano== 1930 % 4==2){
    alert(`Sim teve Copa em ${ano}`);  
    }else{
 alert(`${ano} é ano de Copa do Mundo`);     
    }
    }while(true)
   </script>
</body>
</html>
